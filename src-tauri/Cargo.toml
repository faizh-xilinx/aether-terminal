[package]
name = "aether"
version = "0.1.1"
description = "The AI-native SSH terminal."
authors = ["Aether contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.80"

[lib]
name = "aether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core + plugins
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors / logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IDs / paths / time
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

# PTY (cross-platform; uses ConPTY on Windows)
portable-pty = "0.8"

# SSH
russh = "0.46"
russh-keys = "0.46"

# Credential vault (Windows DPAPI / macOS Keychain / libsecret)
keyring = "3"

# Config / parsing
ssh2-config = "0.5"
shellexpand = "3"

# Channels / sync
parking_lot = "0.12"
dashmap = "6"

# DPAPI for cross-launch token persistence on Windows. The keyring crate's
# Credential Manager backend is intermittently flaky in non-interactive
# processes (documented in vault::tests::keyring_round_trip); we encrypt the
# token blob with the user's data-protection key and stash it in
# %APPDATA%\Aether\session.bin as a deterministic backup.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
