name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  sidecar:
    name: Sidecar (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # tauri-build's build script validates that `frontendDist` (the
      # Vite output) exists; cargo invocations therefore need a populated
      # ../dist before clippy/test will run cleanly. We skip the
      # postinstall script (which would do `npm --prefix sidecar install`)
      # because (a) the Rust job doesn't run any sidecar code, and (b)
      # nested installs hit intermittent EPERM errors on Windows runners
      # while npm cleans up grandchild node_modules — a long-standing
      # Windows-only npm flakiness the sidecar job already covers in
      # isolation on Ubuntu.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --all
        working-directory: src-tauri

  bundle:
    name: Tauri bundle (Windows)
    runs-on: windows-latest
    needs: [frontend, sidecar, rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run icons
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: aether-windows
          path: src-tauri/target/release/bundle/**/*
